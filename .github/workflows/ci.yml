name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Fetch source
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q .
          git remote add origin "$SERVER_URL/$REPO"
          git -c "http.extraheader=Authorization: basic $auth" fetch --no-tags --depth=1 origin "$COMMIT_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Verify toolchain
        run: |
          set -euo pipefail
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) { console.error("Node >=22 required, found " + process.version); process.exit(1); }'
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else "Python >=3.12 required")'
      - name: Install pnpm
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
