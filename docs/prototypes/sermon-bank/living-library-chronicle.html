function tagRail(){const show=['all',...tags().slice(0,9)];return '<div class="topic-wrap"><div class="mini-label">EXPLORE A THEME</div><div class="tagrail">'+show.map(t=>button(t==='all'?'All themes':t,'tag',t,'topic-chip '+(state.tag===t?'on':''))).join('')+'</div></div>'}
function searchBar(){const examples=[['John 3:16','verse'],['Rom 8:28','verse'],['God so loved','notes']];return '<div class="search-discovery"><div class="search-intro"><div><span class="mini-label">YOUR ARCHIVE KNOWS THE SCRIPTURES</span><h2>Find the verse. Find the message.</h2></div><span>From the sermon passage <em>or inside your original notes.</em></span></div><div class="searchbox scripture-search">'+svg('search',21)+'<input id="search-input" type="search" autocomplete="off" placeholder="Try John 3:16, Jn 3:16, or words from your notes…" aria-label="Search Scripture references and notes" value="'+esc(state.query)+'"/><span class="shortcut-hint">/</span>'+(state.query?button('×','clear-search','','clear-search'):'')+'</div><div class="verse-search-tools"><div class="search-lens" role="group" aria-label="Search scope">'+[['all','Everything'],['verse','Bible verses'],['notes','Inside notes only']].map(([k,v])=>button(v,'search-lens',k,'lens-btn '+(state.searchLens===k?'on':''))).join('')+'</div><div class="search-examples"><span>TRY</span>'+examples.map(([term,lens])=>button(term,'try-verse',term,'example-chip')).join('')+'</div></div>'+(state.query?searchSummary():'')+'</div>'}
function searchSummary(){const filtered=matches(),q=state.query;const notesCount=filtered.filter(s=>evidence(s,q,state.searchLens).notes.length).length;const metaCount=filtered.filter(s=>evidence(s,q,state.searchLens).passage.length).length;return '<div class="search-feedback"><span class="search-feedback-icon">✳</span><div><b>'+filtered.length+' sermons found</b> · '+notesCount+' with matches in indexed notes'+(state.searchLens!=='notes'?' · '+metaCount+' with a sermon Scripture match':'')+'<p>Results name the document version, so you can tell a note hit from a passage listed only as metadata.</p></div></div>'}

function toolbar(){return '<div class="utility-row"><div class="view-switch" role="group" aria-label="Library view">'+[['cards','grid','Covers'],['rows','rows','Quick rows'],['table','table','Table'],['calendar','calendar','Calendar']].map(([k,ic,label])=>button(svg(ic,16)+' <span>'+label+'</span>','view',k,'view-btn '+(state.view===k?'on':''))).join('')+'</div><div class="right-tools"><span class="result-amount">'+matches().length+' sermons</span>'+button(state.archived?'Show active':'Archived','toggle-archived','','text-btn')+button(state.sort==='recent'?'↓ Last preached':state.sort==='title'?'A–Z Title':'↓ Most preached','cycle-sort','','text-btn')+'</div></div>'}
function bookCover(s,i){const types=['moss','linen','night','sage','clay','pine','paper'];return '<div class="bookcover cover-'+types[(s.id+i)%types.length]+'"><div class="cover-line"></div><div class="cover-index">S / '+String(s.id).padStart(3,'0')+'</div><div class="cover-motif"><i></i><i></i><i></i></div><span class="cover-series">'+esc(s.series||'Collected')+'</span><div class="cover-edge"></div></div>'}
function resultSnippet(s){if(!state.query)return '';return noteHitMarkup(s,state.query)}
function statusTag(s){const k=status(s);return '<span class="status '+(k==='Indexed'?'ok':k==='Access revoked'?'revoked':k==='Indexing'?'pending':'neutral')+'">'+esc(k)+'</span>'}
function cardsView(items){return '<div class="cards-grid">'+items.map((s,i)=>'<article class="sermon-card" style="--order:'+Math.min(i,8)+'">'+button(bookCover(s,i),'open-sermon',s.id,'cover-button')+'<div class="card-info"><div class="card-upper"><span>'+esc(s.series||'Unfiled')+'</span>'+statusTag(s)+'</div><button data-action="open-sermon" data-value="'+s.id+'" class="sermon-name">'+esc(s.title)+'</button><p>'+esc(s.scripture||'No Scripture')+' · '+s.events.length+' preachings</p>'+resultSnippet(s)+'<div class="card-foot"><small>'+niceDate(last(s))+'</small>'+button('Explore '+svg('arrow',15),'open-sermon',s.id,'icon-link')+'</div></div></article>').join('')+'</div>'}
function rowsView(items){return '<div class="quick-list">'+items.map((s,i)=>'<article class="quick-row"><span class="row-num">'+String(i+1).padStart(2,'0')+'</span><span class="row-marker marker-'+(s.id%5)+'"></span><div class="quick-primary"><button class="sermon-name" data-action="open-sermon" data-value="'+s.id+'">'+esc(s.title)+'</button><div class="subline">'+esc(s.scripture||'No Scripture')+' <span>·</span> '+esc(s.series||'Unfiled')+'</div>'+resultSnippet(s)+'</div><div class="quick-meta"><strong>'+s.events.length+'</strong><span>preachings</span></div><div class="quick-date">'+niceDate(last(s))+'</div>'+button(svg('arrow',18),'open-sermon',s.id,'row-open')+'</article>').join('')+'</div>'}
function tableView(items){return '<div class="table-scroller"><table class="sermon-table"><thead><tr><th>MESSAGE</th><th>SCRIPTURE</th><th>LAST PREACHED</th><th>OCCASIONS</th><th>DOCUMENTS</th><th></th></tr></thead><tbody>'+items.map(s=>'<tr><td><button class="sermon-name" data-action="open-sermon" data-value="'+s.id+'">'+esc(s.title)+'</button><div class="subline">'+esc(s.series||'Unfiled')+'</div></td><td>'+esc(s.scripture||'—')+'</td><td>'+niceDate(last(s))+'</td><td>'+s.events.length+'</td><td>'+statusTag(s)+'</td><td>'+button(svg('arrow',16),'open-sermon',s.id,'table-open')+'</td></tr>').join('')+'</tbody></table></div>'}
function calendarNav(){return '<div class="month-head"><div><div class="mini-label">PREACHING CALENDAR</div><h2>'+monthName(state.monthYear,state.month)+'</h2></div><div class="month-arrows">'+button('←','month-prev','','circle-btn')+button('Today','month-reset','','outline-small')+button('→','month-next','','circle-btn')+'</div></div>'}
function dateEvents(date){return matches().filter(s=>!s.archived).flatMap(s=>s.events.filter(e=>e.date===date).map(e=>({...e,s})));}
function calendarGrid(){const y=state.monthYear,m=state.month,n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),start=new Date(Date.UTC(y,m,1)).getUTCDay();let html='<div class="calendar-grid">'+['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>'<div class="weekday">'+d+'</div>').join('');for(let i=0;i<start;i++)html+='<div class="day-cell empty-cell"></div>';for(let d=1;d<=n;d++){const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),count=dateEvents(iso).length;html+=button('<span class="date-number">'+d+'</span>'+(count?'<span class="event-dots">'+(count>1?'● ●':'●')+'</span>':'')+(count?'<span class="date-count">'+count+' preached</span>':''),'day',iso,'day-cell '+(count?'has-event ':'')+(state.calendarDay===iso?'chosen':''));}html+='</div>';return html}
function dayPanel(){const d=state.calendarDay||state.monthYear+'-'+String(state.month+1).padStart(2,'0')+'-01';const all=dateEvents(d);return '<div class="day-inspector"><div class="mini-label">SELECTED DAY</div><h3>'+niceDate(d)+'</h3>'+(all.length?all.map(e=>'<div class="day-event"><small>'+esc(e.place)+'</small><button data-action="open-sermon" data-value="'+e.s.id+'">'+esc(e.s.title)+'</button><p>'+esc(e.version)+'</p></div>').join(''):'<div class="day-empty">No preaching on this date.<br><span>Choose a marked day to see its messages.</span></div>')+'</div>'}
function calendarView(){return '<div class="hybrid-calendar"><div class="calendar-story"><div><span>THE CHRONICLE</span><h2>The month you shared it.</h2><p>Follow your messages through the years. Pick a month, then open any day to see exactly which version you preached.</p></div><div class="calendar-spark" aria-hidden="true">✺</div></div><div class="hybrid-yearmap">'+yearMosaic()+'</div><div class="calendar-layout"><div class="calendar-main">'+calendarNav()+calendarGrid()+'</div>'+dayPanel()+'</div></div>'}
function yearMosaic(){const y=state.year==='all'?2026:Number(state.year);return '<div class="mosaic-head"><div class="mini-label">YOUR YEAR AT A GLANCE</div><strong>'+y+'</strong><span>Choose a month to explore</span></div><div class="mosaic">'+Array.from({length:12},(_,m)=>{const mo=monthName(y,m).split(' ')[0],count=allEvents().filter(e=>e.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length;return button('<span>'+mo.slice(0,3)+'</span><b>'+String(count).padStart(2,'0')+'</b><i style="--level:'+Math.max(4,count*24)+'%"></i>','mosaic-month',y+'-'+m,'mosaic-month '+(state.monthYear===y&&state.month===m?'on':''))}).join('')+'</div>'}
function filtersIntro(){return '<div class="filter-wrap">'+yearRail()+tagRail()+'</div>'}
function allCollection(){const items=matches();if(state.demoState==='denied')return '<div class="state-panel blocked"><h3>No access to this workspace</h3><p>Not even titles, counts, search snippets or downloads are available.</p>'+button('Return to demo','set-ready','','secondary')+'</div>';if(state.demoState==='error')return '<div class="state-panel blocked"><h3>We couldn’t reach the archive</h3><p>Your content hasn’t changed. Retry without losing your place.</p>'+button('Retry','set-ready','','secondary')+'</div>';if(state.demoState==='loading')return '<div class="loading-stack" aria-busy="true"><span></span><span></span><span></span><span></span></div>';if(state.demoState==='empty'||!items.length)return '<div class="state-panel"><div class="empty-drawing">'+svg('book',42)+'</div><h3>'+ (state.demoState==='empty'?'Your first chapter starts here.':'Nothing on this shelf yet.')+'</h3><p>'+(state.demoState==='empty'?'Create your first sermon record. Your documents remain where they are.':'Try another year, theme, or phrase.')+'</p>'+button(state.demoState==='empty'?'Add a sermon':'Clear filters',state.demoState==='empty'?'add-sermon':'clear-all','','secondary')+'</div>';return state.view==='cards'?cardsView(items):state.view==='rows'?rowsView(items):state.view==='table'?tableView(items):calendarView()}
function monthTeaser(){const es=allEvents().filter(e=>e.date.startsWith('2026-10')).slice(0,3);return '<div class="month-teaser"><div class="month-teaser-title"><span>✺ THE PREACHING CHRONICLE</span><b>October, in the making.</b><p>Where the stories went next. Visit the full month-by-month calendar.</p></div><div class="teaser-events">'+es.map(e=>'<button class="teaser-event" data-action="open-sermon" data-value="'+e.sermon.id+'"><span>'+niceDate(e.date)+'</span><b>'+esc(e.sermon.title)+'</b><small>'+esc(e.place)+'</small></button>').join('')+'</div>'+button('Open calendar →','open-calendar','','teaser-open')+'</div>'}
function libraryPage(){if(state.demoState==='denied')return '<div class="main-container denied-screen"><div class="state-panel blocked"><h3>Workspace access unavailable</h3><p>No sermon titles, counts, indexed notes, or file links are exposed.</p>'+button('Return to the demo','set-ready','','secondary')+'</div></div>';return hero()+'<div class="main-container"><div class="collection-caption"><span>THE COLLECTION</span><strong>Find the story you’re looking for.</strong></div>'+searchBar()+filtersIntro()+toolbar()+allCollection()+(state.view==='cards'&&!state.query?monthTeaser():'')+'</div>'}
function settingsPage(){const nav=['Workspace','People & Access','Places','Import Review','Documents & Privacy','Preferences'];return '<section class="settings-page"><div class="settings-header"><div class="eyebrow">YOUR SPACE, YOUR CHOICES</div><h1>Settings, all in one place.</h1><p>Collaborators, churches, import reviews, and privacy live together—not scattered across the library.</p></div><div class="settings-layout"><nav class="settings-rail" aria-label="Settings sections">'+nav.map(k=>button(k,'settings-section',k,'settings-tab '+(state.settings===k?'on':''))).join('')+'</nav><div class="settings-content">'+settingsSection()+'</div></div></section>'}
function settingCard(title,sub,content){return '<section class="setting-card"><div class="setting-cardhead"><h3>'+title+'</h3><p>'+sub+'</p></div>'+content+'</section>'}
function settingsSection(){const k=state.settings,peopleHere=people[state.workspace];if(k==='Workspace')return settingCard('Workspaces','Your archives are private to the people you invite.','<div class="workspace-selection">'+Object.entries(workspaces).map(([id,w])=>'<div class="person-row"><div><b>'+esc(w.name)+'</b><span>'+esc(id===state.workspace?state.role:w.role)+' · '+esc(id==='personal'?'Personal archive':'Shared archive')+'</span></div>'+button(id===state.workspace?'Current':'Switch','switch-workspace',id,id===state.workspace?'muted-btn':'secondary')+'</div>').join('')+'</div>'+button('Preview onboarding','onboarding','','secondary'))+settingCard('Ownership and portability','Only an Owner can request the complete workspace export.','<div class="setting-info">Exports include app records and uploaded PDF originals. Linked Google Docs remain references—not copies.</div>'+button('Preview export','export','',roleAllowed('owner')?'secondary':'secondary disabled-permission'));if(k==='People & Access')return settingCard('People & access','Delegate everyday management without giving up ownership.','<div class="person-list">'+peopleHere.map((p,i)=>'<div class="person-row"><div><b>'+esc(p.name)+'</b><span>'+esc(p.role)+'</span></div>'+(p.role!=='Owner'&&roleAllowed('manage')&&(state.role==='Owner'||p.role!=='Admin')?button('Manage','manage-person',i,'secondary'):'<span class="quiet-tag">Protected</span>')+'</div>').join('')+'</div>'+button('Invite a collaborator','invite-person','','primary'))+settingCard('The permission model','Owner, delegated Admin, Editor and Viewer.','<div class="setting-info"><b>Owner:</b> permissions and ownership · <b>Admin:</b> archive and Editor/Viewer invitations · <b>Editor:</b> archive records · <b>Viewer:</b> read-only. No app role can modify a source document.</div>');if(k==='Places')return settingCard('Your places','A name change updates every related preaching.','<div class="person-list">'+places().map(p=>'<div class="person-row"><div><b>'+esc(p)+'</b><span>'+rows().flatMap(s=>s.events).filter(e=>e.place===p).length+' preaching occasions</span></div>'+button('Rename / merge','rename-place',p,'secondary')+'</div>').join('')+'</div>'+button('+ Add place','new-place','','secondary'));if(k==='Import Review')return settingCard('Import review queue','Private staged records keep provenance and unresolved uncertainties.','<div class="person-list">'+imports.map((r,i)=>'<div class="person-row"><div><b>'+esc(r.title)+'</b><span>'+esc(r.flags)+' · '+(r.done?'Verified':'Needs review')+'</span></div>'+button('Review','review-import',i,'secondary')+'</div>').join('')+'</div><div class="setting-info">Original archive data is never published or silently assigned to a pastor.</div>');if(k==='Documents & Privacy')return settingCard('Document integrity','Your existing sermon notes stay where they are.','<div class="source-grid"><div><span>Google Docs</span><b>Read only</b><p>Google Drive is the source of truth. Owner consent is required to share indexed extracted text with workspace roles.</p></div><div><span>PDFs</span><b>Immutable files</b><p>A revision is a new upload and a named version. Existing PDF bytes are never overwritten.</p></div></div>'+button('See consent disclosure','consent-disclosure','','secondary'))+settingCard('Current source states','Statuses communicate why search may not yet include text.','<div class="person-list">'+rows().slice(0,5).map(s=>'<div class="person-row"><b>'+esc(s.title)+'</b>'+statusTag(s)+'</div>').join('')+'</div>');return settingCard('Preview the different roles','See the permission boundaries before implementation.','<div class="setting-info">Current role: <strong>'+esc(state.role)+'</strong>. Use the role dropdown in the masthead to preview limits; the production backend must enforce them separately.</div>'+button('Reset fictional data','reset','','secondary'))+settingCard('Accessibility and states','Animations are restrained and turn off for reduced-motion preferences.','<div class="demo-controls">'+['ready','loading','empty','error','denied'].map(v=>button(v,'demo-state',v,'mini-pill '+(state.demoState===v?'on':''))).join('')+'</div>')}
function detailContent(s){if(!s)return '';
 const overview='<div class="detail-overview"><div class="detail-eyebrow">'+esc(s.series||'Unfiled')+' · '+esc(s.scripture||'No Scripture')+'</div><p>'+esc(s.note||'A new sermon. Add a version or preaching to begin its story.')+'</p><div class="detail-small"><span>'+s.events.length+' preaching occasions</span><span>'+s.versions.length+' named versions</span></div></div>';
 const preaching='<div class="detail-rows">'+(s.events.length?s.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>'<div class="detail-row"><div><b>'+niceDate(e.date)+'</b><small>'+esc(e.place)+' · '+esc(e.occasion||'Preaching')+'</small></div><span>'+esc(e.version||'No version')+'</span></div>').join(''):'<p>No preachings yet.</p>')+'</div>';
 const versions='<div class="detail-rows">'+(s.versions.length?s.versions.map(v=>'<div class="detail-row"><div><b>'+esc(v.name)+'</b><small>'+esc(v.kind)+' · '+esc(v.status)+'</small></div><span class="read-only">READ-ONLY SOURCE</span></div>').join(''):'<p>No versions yet.</p>')+'</div>';
 const find='<section class="within-sermon"><div class="within-head"><div class="eyebrow">THIS SERMON · DOCUMENT SEARCH</div><h3>Is this verse in my notes?</h3><p>Search each indexed Google Doc or PDF version attached to <b>'+esc(s.title)+'</b>. Unlike Scripture metadata, a note hit points to an actual source excerpt.</p></div><div class="within-search"><span>⌕</span><input id="within-notes-search" type="search" aria-label="Search inside notes of this sermon" placeholder="Try John 3:16, Rom 8:28, or wording from the passage" value="'+esc(state.withinQuery)+'" /></div><div class="within-pills">'+['John 3:16','Romans 8:28','Psalm 23:1'].map(q=>button(q,'within-suggest',q,'within-example')).join('')+'</div><div id="within-notes-results" aria-live="polite">'+withinResults(s,state.withinQuery)+'</div></section>';
 const view=state.detailTab==='Overview'?overview:state.detailTab==='Preachings'?preaching:state.detailTab==='Versions'?versions:find;
 return '<div class="detail-tabs">'+['Overview','Find in notes','Preachings','Versions'].map(k=>button(k,'detail-tab',k,'detail-tab '+(state.detailTab===k?'on':''))).join('')+'</div>'+view+'<div class="detail-actions">'+button('Find a verse in my notes','notes-focus',s.id,'secondary')+button('Add preaching','add-preaching',s.id,'secondary')+button('Add version','add-version',s.id,'secondary')+button('Edit metadata','edit-sermon',s.id,'secondary')+'</div><div class="detail-footer"><div class="safe-note">Existing Google Docs and PDFs remain unchanged. Revoked or unindexed versions do not expose note text.</div>'+button(s.archived?'Restore':'Archive','archive-sermon',s.id,'quiet-link')+'</div>'}

function dialog(title,subtitle,body){host.querySelector('#dialog-title').textContent=title;host.querySelector('#dialog-subtitle').textContent=subtitle;host.querySelector('#dialog-body').innerHTML=body;host.querySelector('#dialog-backdrop').classList.add('open');host.querySelector('#dialog-backdrop').setAttribute('aria-hidden','false');const e=host.querySelector('#dialog-body input:not([type=hidden]),#dialog-body select, #dialog-close');if(e)e.focus()}
function closeDialog(){host.querySelector('#dialog-backdrop').classList.remove('open');host.querySelector('#dialog-backdrop').setAttribute('aria-hidden','true')}
function modalForm(type,s){const input=(name,label,value='',extra='')=>'<label class="field"><span>'+label+'</span><input name="'+name+'" value="'+esc(value)+'" '+extra+'/></label>';const actions=label=>'<div class="form-actions">'+button('Cancel','close','','secondary')+'<button type="submit" class="primary">'+label+'</button></div>';
if(type==='sermon'){dialog(s?'Edit archive metadata':'Add a sermon',s?'Your linked notes are unaffected.':'A title is enough; add versions and preachings later.','<form data-form="sermon" class="app-form"><input type="hidden" name="id" value="'+(s?.id||'')+'"/>'+input('title','Sermon title',s?.title||'','required maxlength="160" placeholder="The day everything changed"')+'<div class="form-two">'+input('scripture','Scripture',s?.scripture||'','placeholder="Romans 8:28"')+input('series','Series',s?.series||'','placeholder="New Beginnings"')+'</div>'+input('tags','Tags (comma separated)',s?.tags?.join(', ')||'','placeholder="Hope, Faith"')+'<div class="safe-note">This updates archive metadata only—not a Google Doc or PDF.</div>'+actions(s?'Save changes':'Create sermon')+'</form>');return}
if(type==='preaching'){const target=s||rows()[0];if(!target){toast('Add a sermon first.');return}dialog('Log a preaching','Another occasion for an existing message—not a duplicate sermon.','<form data-form="preaching" class="app-form"><label class="field"><span>Existing sermon</span><select name="sermon" id="preaching-sermon">'+rows().filter(x=>!x.archived).map(x=>'<option value="'+x.id+'" '+(x.id===target.id?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></label><div class="form-two">'+input('date','Date preached','2026-11-08','type="date" required')+input('place','Church or venue','','required placeholder="Choose or enter"')+'</div>'+input('occasion','Occasion','Sunday Gathering')+'<label class="field"><span>Version used</span><select name="version" id="preaching-version"><option value="">Not specified</option>'+target.versions.map(v=>'<option>'+esc(v.name)+'</option>').join('')+'</select></label>'+actions('Log preaching')+'</form>');return}
if(type==='version'){if(!s)return;dialog('Add a named version',esc(s.title)+' · Source files stay unchanged.','<form data-form="version" class="app-form"><input type="hidden" name="id" value="'+s.id+'"/>'+input('label','Version label','','required placeholder="Community Night 2027"')+'<label class="field"><span>Source type</span><select name="kind"><option>Google Doc</option><option>PDF</option><option>External link</option></select></label>'+input('url','HTTPS link (PDF demo can be blank)','','placeholder="https://docs.google.com/document/d/..."')+(roleAllowed('owner')?'<label class="checkline"><input name="consent" type="checkbox"/> I explicitly approve derived Google Doc text being searchable by authorized members of this workspace.</label>':'<div class="safe-note">Only the Owner can authorize searchable Google Doc text.</div>')+'<div class="safe-note">Demo only: this saves a reference, not a real file upload or Google authorization.</div>'+actions('Save version')+'</form>');return}
if(type==='invite'){dialog('Invite a collaborator','Owner may delegate Admin. Admin may invite only Editor and Viewer.','<form data-form="invite" class="app-form">'+input('email','Email address','','type="email" required placeholder="assistant@example.com"')+'<label class="field"><span>Workspace access</span><select name="role">'+(roleAllowed('owner')?'<option>Admin</option>':'')+'<option>Editor</option><option>Viewer</option></select></label><div class="safe-note">No email is actually sent. This is only a private interaction demonstration.</div>'+actions('Preview invitation')+'</form>');return}
if(type==='place'){const count=rows().flatMap(x=>x.events).filter(x=>x.place===s).length;dialog(s?'Rename or merge a place':'Add a place',s?count+' preaching occasions will be updated.':'Keep place names consistent throughout the archive.','<form data-form="place" class="app-form"><input name="old" type="hidden" value="'+esc(s||'')+'"/>'+input('name','Place name',s||'','required')+(s?'<label class="field"><span>Merge into existing place (optional)</span><select name="merge"><option value="">Keep distinct</option>'+places().filter(x=>x!==s).map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label><label class="checkline"><input type="checkbox" name="confirm" required/> I reviewed the impacted preaching records.</label>':'')+actions('Save place')+'</form>');return}
if(type==='review'){const r=imports[Number(s)];dialog('Review imported record',r.flags,'<form data-form="review" class="app-form"><input type="hidden" name="id" value="'+s+'"/>'+input('note','Reviewer notes',r.note||'')+(roleAllowed('owner')?'<label class="checkline"><input type="checkbox" name="verified"/> Ownership and source attribution have been verified.</label>':'<div class="safe-note">Editors may document a review; an Owner must verify attribution.</div>')+actions('Save review')+'</form>');return}
if(type==='confirm'){const txt=s?.title||'this record';dialog('Archive this sermon?',esc(txt),'<'+'form data-form="archive" class="app-form"><input type="hidden" name="id" value="'+s.id+'"/><div class="safe-note">Archiving is reversible. No original file will change.</div>'+actions('Archive record')+'</form>');}
}
function toast(text){const t=host.querySelector('#toast');t.textContent=text;t.classList.add('show');clearTimeout(window.__sermonToast);window.__sermonToast=setTimeout(()=>t.classList.remove('show'),2700)}
function render(){host.querySelector('#app-header').innerHTML=header();let main=state.page==='library'?libraryPage():settingsPage();if(state.demoState==='denied')main='<div class="main-container denied-screen"><div class="state-panel blocked"><h3>Workspace access unavailable</h3><p>No sermon titles, counts, membership, indexed notes, or file links are exposed.</p>'+button('Return to the demo','set-ready','','secondary')+'</div></div>';else if(state.demoState==='loading')main='<div class="main-container"><div class="loading-stack" aria-busy="true"><span></span><span></span><span></span></div></div>';else if(state.demoState==='error')main='<div class="main-container"><div class="state-panel blocked"><h3>Archive temporarily unavailable</h3><p>Your records have not been changed. Retry when the service is ready.</p>'+button('Retry','set-ready','','secondary')+'</div></div>';host.querySelector('#app-main').innerHTML=main;host.setAttribute('data-view',state.view);host.setAttribute('data-page',state.page);host.setAttribute('data-mode',mode)}
function openSermon(id){const s=get(id);if(!s)return;if(mode==='index'){state.selectedId=s.id;render();return}state.selectedId=s.id;state.withinQuery=state.query;state.detailTab=state.query&&(state.searchLens!=='all'||bibleRefs(state.query).length)?'Find in notes':'Overview';dialog(s.title,s.scripture+' · '+s.series,detailContent(s))}
function updateModalDetails(){const s=get(state.selectedId);if(s){host.querySelector('#dialog-body').innerHTML=detailContent(s);}}
function setWorkspace(id){if(!workspaces[id])return;state.workspace=id;state.role=workspaces[id].role;state.year='all';state.query='';state.searchLens='all';state.withinQuery='';state.tag='all';state.place='all';state.archived=false;state.selectedId=null;state.workspaceMenu=false;state.settings='Workspace';state.page='library';render();toast('Switched to a separate fictional workspace. No cross-workspace data is shown.')}
host.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!host.contains(b))return;const a=b.dataset.action,v=b.dataset.value;
if(a==='workspace-menu'){state.workspaceMenu=!state.workspaceMenu;render();return}
if(a==='switch-workspace'){setWorkspace(v);return}
if(a==='nav'){state.page=v;state.workspaceMenu=false;render();return}
if(a==='search-lens'){state.searchLens=v;render();return}
if(a==='try-verse'){state.query=v;state.searchLens=v==='God so loved'?'notes':'verse';state.year='all';render();host.querySelector('#search-input')?.focus();return}
if(a==='open-calendar'){state.view='calendar';state.year='2026';state.monthYear=2026;state.month=9;state.calendarDay='2026-10-18';render();host.querySelector('.hybrid-calendar')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(a==='within-suggest'){state.withinQuery=v;const q=host.querySelector('#within-notes-search');if(q)q.value=v;const target=host.querySelector('#within-notes-results');const s=get(state.selectedId);if(target&&s)target.innerHTML=withinResults(s,v);return}
if(a==='notes-focus'){state.selectedId=Number(v);state.detailTab='Find in notes';state.withinQuery=state.query;updateModalDetails();host.querySelector('#within-notes-search')?.focus();return}
if(a==='view'){state.view=v;if(v==='calendar'){state.monthYear=state.year==='all'?2026:Number(state.year);state.month=9;state.calendarDay=null;}render();return}
if(a==='year'){state.year=v;state.monthYear=v==='all'?2026:Number(v);state.month=9;state.calendarDay=null;render();return}
if(a==='tag'){state.tag=v;render();return}
if(a==='clear-all'){state.year='all';state.tag='all';state.place='all';state.query='';state.archived=false;render();return}
if(a==='clear-search'){state.query='';render();return}
if(a==='cycle-sort'){state.sort=state.sort==='recent'?'title':state.sort==='title'?'most':'recent';render();return}
if(a==='toggle-archived'){state.archived=!state.archived;render();return}
if(a==='month-prev'||a==='month-next'){const d=new Date(Date.UTC(state.monthYear,state.month+(a==='month-next'?1:-1),1));state.monthYear=d.getUTCFullYear();state.month=d.getUTCMonth();state.year=String(state.monthYear);state.calendarDay=null;render();return}
if(a==='month-reset'){state.monthYear=2026;state.month=9;state.year='2026';state.calendarDay=null;render();return}
if(a==='day'){state.calendarDay=v;render();return}
if(a==='mosaic-month'){const [year,mo]=v.split('-').map(Number);state.monthYear=year;state.month=mo;state.year=String(year);state.calendarDay=null;render();return}
if(a==='open-sermon'){openSermon(v);return}
if(a==='detail-modal'){const s=get(v);state.selectedId=s?.id;state.withinQuery=state.query;state.detailTab='Overview';if(s)dialog(s.title,s.scripture,detailContent(s));return}
if(a==='detail-tab'){state.detailTab=v;updateModalDetails();if(v==='Find in notes')host.querySelector('#within-notes-search')?.focus();return}
if(a==='add-sermon'){if(!roleAllowed('edit')){toast('Viewers have read-only access.');return}modalForm('sermon');return}
if(a==='edit-sermon'){if(roleAllowed('edit'))modalForm('sermon',get(v));return}
if(a==='add-preaching'){if(roleAllowed('edit'))modalForm('preaching',get(v));return}
if(a==='add-version'){if(roleAllowed('edit'))modalForm('version',get(v));return}
if(a==='settings-section'){state.settings=v;render();return}
if(a==='invite-person'){if(roleAllowed('manage'))modalForm('invite');else toast('Only Owners and Admins can invite.');return}
if(a==='manage-person'){const i=Number(v),p=people[state.workspace][i];if(!p||p.role==='Owner'||!roleAllowed('manage')||(p.role==='Admin'&&!roleAllowed('owner')))return;dialog('Manage member',p.name+' · '+p.role,'<form data-form="member-role" class="app-form"><input type="hidden" name="id" value="'+i+'"/><label class="field"><span>Workspace role</span><select name="role">'+(roleAllowed('owner')?'<option '+(p.role==='Admin'?'selected':'')+'>Admin</option>':'')+'<option '+(p.role==='Editor'?'selected':'')+'>Editor</option><option '+(p.role==='Viewer'?'selected':'')+'>Viewer</option></select></label><div class="safe-note">Changing an app role does not change Google Drive permissions. Never expose another workspace.</div><div class="form-actions">'+button('Cancel','close','','secondary')+'<button type="submit" class="primary">Update role</button></div></form><div style="margin-top:16px">'+button('Revoke demo member','revoke-member',i,'danger-btn')+'</div>');return}
if(a==='revoke-member'){const p=people[state.workspace][Number(v)];if(!p||p.role==='Owner'||!roleAllowed('manage')||(p.role==='Admin'&&!roleAllowed('owner')))return;people[state.workspace].splice(Number(v),1);closeDialog();render();toast('Fictional workspace member removed.');return}
if(a==='rename-place'){if(roleAllowed('edit'))modalForm('place',v);else toast('Only Editors and above can change places.');return}
if(a==='new-place'){if(roleAllowed('edit'))modalForm('place','');return}
if(a==='review-import'){if(roleAllowed('edit'))modalForm('review',v);else toast('No edit access.');return}
if(a==='consent-disclosure'){dialog('A privacy boundary worth explaining','Explicit Owner consent before indexed text is shared.','<div class="safe-note">Sermon Bank can index only an authorized, read-only Google Doc. Workspace members may search the derived text with Owner permission, even if Google Drive permissions prevent opening the original. Revocation purges searchable text. The original Google file remains untouched.</div>'+button('Understood','close','','secondary'));return}
if(a==='onboarding'){dialog('A quiet welcome','Choose the right entry into Sermon Bank.','<div class="onboard-grid">'+button('I have my own sermons','onboard-owner','','secondary')+button('A pastor invited me','onboard-assistant','','secondary')+'</div><div class="safe-note">Independent sign-in is part of production. This prototype does not connect accounts.</div>');return}
if(a==='onboard-owner'||a==='onboard-assistant'){closeDialog();toast(a==='onboard-owner'?'A private personal workspace would be created after sign-in.':'An assistant would enter only the invited workspace after verification.');return}
if(a==='export'){if(!roleAllowed('owner')){toast('Owner-only export');return}dialog('Owner archive export','Preview only, no live export','<div class="safe-note">The export will contain workspace metadata, named versions, preaching history, and original PDF uploads. Linked Google Docs remain references, never snapshots.</div>'+button('Close','close','','secondary'));return}
if(a==='reset'){workspaces.personal.records=clone(SEED);workspaces.shared.records=clone(SHARED_SEED);extraPlaces.personal=[];extraPlaces.shared=[];people.personal=[{name:'Pastor Morgan',role:'Owner'},{name:'Jo Reyes',role:'Editor'},{name:'Sam Quinn',role:'Viewer'}];people.shared=[{name:'Pastor Riley',role:'Owner'},{name:'Pastor Morgan',role:'Editor'}];state.workspace='personal';state.role='Owner';state.year='all';state.query='';state.searchLens='all';state.withinQuery='';state.tag='all';state.selectedId=null;state.page='library';state.demoState='ready';render();toast('Fictional data restored.');return}
if(a==='demo-state'){state.demoState=v;render();return}
if(a==='set-ready'){state.demoState='ready';render();return}
if(a==='archive-sermon'){const s=get(v);if(!s||!roleAllowed('edit'))return;if(s.archived){s.archived=false;render();toast('Restored in the demo.');return}modalForm('confirm',s);return}
if(a==='close'){closeDialog();return}
});
host.addEventListener('input',e=>{if(e.target.id==='within-notes-search'){state.withinQuery=e.target.value;const out=host.querySelector('#within-notes-results');const s=get(state.selectedId);if(out&&s)out.innerHTML=withinResults(s,state.withinQuery);return}if(e.target.id==='search-input'){state.query=e.target.value;const p=e.target.selectionStart;render();const x=host.querySelector('#search-input');if(x){x.focus();if(p!=null)x.setSelectionRange(p,p)}}});
host.addEventListener('change',e=>{if(e.target.id==='role-pick'){state.role=e.target.value;render();toast('Demo role: '+state.role+' (not real authorization).')}if(e.target.id==='preaching-sermon'){const s=get(e.target.value),x=host.querySelector('#preaching-version');if(x)x.innerHTML='<option value="">Not specified</option>'+(s?.versions||[]).map(v=>'<option>'+esc(v.name)+'</option>').join('')}});
host.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const d=new FormData(f),kind=f.dataset.form;const id=Number(d.get('id'));if(!roleAllowed('edit')&&kind!=='invite')return;
if(kind==='sermon'){let s=get(id);const title=String(d.get('title')||'').trim();if(!title)return;const newRecord=!s;if(!s){s={id:Math.max(0,...rows().map(v=>v.id))+1,title,scripture:'',series:'',tags:[],note:'',versions:[],events:[]};rows().unshift(s)}if(newRecord){state.view=mode==='study'?'cards':'rows';state.year='all';state.tag='all';state.query='';state.archived=false;}s.title=title;s.scripture=String(d.get('scripture')||'').trim();s.series=String(d.get('series')||'').trim();s.tags=String(d.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);toast('Metadata saved in this demo. No original document modified.')}
if(kind==='preaching'){const s=get(d.get('sermon'));if(!s)return;const date=String(d.get('date')||''),place=String(d.get('place')||'').trim(),version=String(d.get('version')||'');if(!date||!place)return;if(version&&!s.versions.some(x=>x.name===version)){toast('Choose a version from that sermon.');return}s.events.push({date,place,version:version||'Not specified',occasion:String(d.get('occasion')||'')});toast('Preaching added; sermon master unchanged.')}
if(kind==='version'){const s=get(id);if(!s)return;const label=String(d.get('label')||'').trim(),type=String(d.get('kind')||''),url=String(d.get('url')||'');if(!label||s.versions.some(x=>x.name.toLowerCase()===label.toLowerCase())){toast('Use a unique version label.');return}if(type!=='PDF'&&!/^https:\/\//i.test(url)){toast('Enter a valid HTTPS link.');return}if(type==='Google Doc'&&!/^https:\/\/docs\.google\.com\/document\/d\//i.test(url)){toast('Use a valid Google Docs URL.');return}s.versions.push({name:label,kind:type,status:type==='Google Doc'?(roleAllowed('owner')&&d.has('consent')?'Indexing':'Owner consent required'):type==='PDF'?'Upload pending':'Link only'});toast('Reference saved; no PDF upload or Google indexing occurred.')}
if(kind==='member-role'){const person=people[state.workspace][Number(d.get('id'))],newRole=String(d.get('role')||'');if(!person||person.role==='Owner'||!roleAllowed('manage')||(!roleAllowed('owner')&&(person.role==='Admin'||newRole==='Admin')))return;person.role=newRole;toast('Fictional member role updated.');}
if(kind==='invite'){if(!roleAllowed('manage'))return;const level=String(d.get('role'));if(level==='Admin'&&!roleAllowed('owner'))return;people[state.workspace].push({name:String(d.get('email')||''),role:level});toast('Invite preview added; no email sent.')}
if(kind==='place'){const before=String(d.get('old')||''),next=String(d.get('merge')||d.get('name')||'').trim();if(!next)return;if(before){for(const s of rows())for(const ev of s.events)if(ev.place===before)ev.place=next;aliases[next]=[...(aliases[next]||[]),before];extraPlaces[state.workspace]=extraPlaces[state.workspace].map(p=>p===before?next:p);if(state.place===before)state.place=next;}else extraPlaces[state.workspace].push(next);toast('Location names updated in metadata only.')}
if(kind==='review'){const r=imports[Number(d.get('id'))];if(!r)return;r.note=String(d.get('note')||'');if(roleAllowed('owner')&&d.has('verified'))r.done=true;toast('Fictional migration review updated.')}
if(kind==='archive'){const s=get(id);if(s&&roleAllowed('edit')){s.archived=true;toast('Archived in demo. Original files untouched.')}}closeDialog();render()});
host.querySelector('#dialog-backdrop').addEventListener('click',e=>{if(e.target.id==='dialog-backdrop')closeDialog()});
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&state.page==='library'){e.preventDefault();host.querySelector('#search-input')?.focus()}if(e.key==='Escape'){closeDialog();if(state.workspaceMenu){state.workspaceMenu=false;render()}}});
render();
})();
</script></body></html>
